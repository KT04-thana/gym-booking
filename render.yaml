services:
  - type: web
    name: gym-booking
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /
    disk:
      name: gym-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /var/data/gym.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false